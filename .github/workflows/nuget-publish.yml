name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify release tag and NuGet account
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo 'Set the NUGET_USER repository variable to your nuget.org username.' >&2
            exit 1
          fi

          version="$(dotnet msbuild Aqualis.fsproj -getProperty:Version)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo 'The tagged commit must be on master.' >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore solution
        run: dotnet restore Aqualis.slnx

      - name: Run tests
        run: dotnet test Aqualis.slnx --configuration Release --no-restore

      - name: Pack Aqualis
        run: dotnet pack Aqualis.fsproj --configuration Release --no-restore --output artifacts

      - name: Log in to nuget.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org via OIDC
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/Aqualis.$PACKAGE_VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
